# Fixture broker: definitions are imported at boot so the state is deterministic.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = false
loopback_users = none
management.rates_mode = basic
# Low watermarks keep the container small but well above the alarm thresholds.
vm_memory_high_watermark.absolute = 400MB
disk_free_limit.absolute = 50MB
log.console.level = warning
